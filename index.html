<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>SchoneInbox – Aanmelden</title>
<link rel="icon" type="image/x-icon" href="https://spengenit.nl/aanmelden-schoneinbox/favicon.ico">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
    body {
        margin: 0;
        padding: 60px 20px;
        font-family: "Inter", Arial, sans-serif;
        background: #F5F7FA;
        display: flex;
        justify-content: center;
    }

    .card-wrapper {
        position: relative;
        max-width: 900px;
        width: 100%;
        margin-top: 2%
    }

    .card {
        background: #E6F8FB; /* soft aqua background */
        border: 3px solid #1E1E1E;
        padding: 60px;
        border-radius: 6px;
        position: relative;
        z-index: 2;
    }

    /* Offset shadow layer */
    .card-shadow {
        position: absolute;
        top: 14px;
        left: 14px;
        width: 100%;
        height: 100%;
        background: #1E1E1E;
        border-radius: 6px;
        z-index: 1;
    }

    .tag {
        display: inline-block;
        background: #DFF7FF;
        padding: 6px 12px;
        font-size: 14px;
        font-weight: 600;
        border: 2px solid #1E1E1E;
        border-radius: 4px;
        margin-bottom: 20px;
    }

    h1 {
        margin: 0;
        margin-bottom: 16px;
        font-size: 36px;
        font-weight: 800;
        color: #1E1E1E;
        line-height: 1.2;
    }

    p {
        font-size: 18px;
        color: #4A4A4A;
        margin-bottom: 40px;
        max-width: 600px;
    }

    .form-row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }

    input[type="email"] {
        flex: 1;
        padding: 16px 20px;
        border-radius: 40px;
        border: 2px solid #1E1E1E;
        font-size: 18px;
        outline: none;
        background: #FFFFFF;
    }

    input[type="email"]:focus {
        border-color: #0099CC;
    }

    button {
        width: 62px;
        height: 62px;
        border-radius: 50%;
        background: #00D9E1;
        border: 2px solid #1E1E1E;
        font-size: 26px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
    }

    button:hover {
        background: #00C4D0;
    }

    .checkbox-area {
        margin-top: 30px;
        font-size: 14px;
        color: #1E1E1E;
        line-height: 1.4;
    }

    .thank-you {
        text-align: center;
        display: none;
    }

    .thank-you h2 {
        font-size: 28px;
        color: #0077B3;
        font-weight: 700;
    }

    /* =======================================
   MOBILE RESPONSIVE IMPROVEMENTS
   ======================================= */

@media (max-width: 768px) {

    body {
        padding: 30px 10px;
    }

    .card-wrapper {
        margin-top: 10%;
    }

    .card {
        padding: 30px 20px;
    }

    .card-shadow {
        top: 8px;
        left: 8px;
    }

    .tag {
        font-size: 12px;
        padding: 4px 10px;
    }

    h1 {
        font-size: 26px;
        line-height: 1.25;
        margin-bottom: 12px;
    }

    p {
        font-size: 15px;
        margin-bottom: 25px;
        max-width: 100%;
    }

    .form-row {
        align-items: stretch;
        gap: 10px;
    }

    input[type="email"] {
        width: 100%;
        font-size: 16px;
        padding: 14px 18px;
        border-radius: 30px;
    }

    button {
        width: 52px;
        height: 52px;
        font-size: 22px;
        align-self: flex-end;
        margin-top: 5px;
    }

    .checkbox-area {
        font-size: 13px;
        margin-top: 20px;
        line-height: 1.4;
    }

    .thank-you h2 {
        font-size: 22px;
        line-height: 1.3;
    }

    .thank-you p {
        font-size: 15px;
    }
}

@media (max-width: 480px) {
    h1 {
        font-size: 22px;
    }

    button {
        width: 48px;
        height: 48px;
        font-size: 20px;
    }

    input[type="email"] {
        font-size: 15px;
        padding: 12px 16px;
    }

    .checkbox-area {
        font-size: 12px;
    }
}

</style>
</head>
<body>

<div class="card-wrapper">

    <div class="card-shadow"></div>

    <div class="card" id="form-card">
        <div class="tag">AANMELDEN</div>

        <h1>Meld je aan voor een SchoneInbox.nl</h1>
        <p>Krijg updates en early access zodra we lanceren.</p>

        <form id="signupForm">
            <div class="form-row">
                <input type="email" name="email" placeholder="jouw@email.com" required>
                <button type="submit">→</button>
            </div>

            <div class="checkbox-area">
                <label>
                    <input name="avg" type="checkbox" required>
                    Ja ik geef toestemming. We gebruiken je gegevens uitsluitend om je te informeren over SchoneInbox.
                    <br>Je data wordt veilig en volgens de AVG verwerkt.
                </label>
            </div>
        </form>

        <div class="thank-you" id="thankyou">
            <h2>Bedankt! Je inbox wordt binnenkort een stuk schoner.</h2>
            <p>Je staat op onze lijst en ontvangt snel meer updates.</p>
        </div>
    </div>

</div>

<script>
document.getElementById("signupForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    document.getElementById("signupForm").style.display = "none";
    document.getElementById("thankyou").style.display = "block";

    const formData = new FormData(e.target);

    // GOOGLE APPS SCRIPT URL HERE
    const BACKEND_URL = "https://vanpopering.info/formpages/schoneinbox-submit/";

    try {
        const response = await fetch(BACKEND_URL, {
            method: "POST",
            body: formData
        });

        if (!response.ok) {
            throw new Error("Backend returned an error");
        }
    } catch (error) {
        alert("Er ging iets mis. Probeer later opnieuw.");
        console.error(error);
    }
});
</script>

</body>
</html>
